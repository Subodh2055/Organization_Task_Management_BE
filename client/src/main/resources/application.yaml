spring:
  application:
    name: task-management
  datasource:
    url: jdbc:sqlserver://localhost:1433;database=client_db;encrypt=true;trustServerCertificate=true;
    username: sa
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}

  # Email is sent only when MAIL_HOST is set; otherwise emails are written to the log.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}

app:
  # Used to build links in emails (e.g. the password reset link).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # HMAC secret for signing login tokens, at least 32 characters. If empty, a random
    # secret is generated at startup and everyone is logged out on every restart.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    # The first ADMIN account is created at startup when no admin exists and a password is set.
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:no-reply@task-management.local}
  storage:
    # Where uploaded attachments are stored on disk.
    location: ${STORAGE_LOCATION:./uploads}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:60}
